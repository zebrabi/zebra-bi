name: Release

# Run from develop with the version that develop already carries. Fast-forwards main to the develop
# commit, tags it v<version>, creates the GitHub release with the plugin ZIP and publishes server.json
# to the MCP Registry. main moves only here, because the Anthropic directory and
# /plugin marketplace add publish whatever main holds.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to release, without the v (e.g. 1.1.21). Must equal version on develop.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    # The environment only accepts develop, waits for an admin's approval and holds RELEASE_DEPLOY_KEY:
    # a write deploy key that the main and Release tags rulesets let through. GITHUB_TOKEN cannot push
    # main or the tag: it may not push commits that change .github/workflows/, and the Release tags
    # ruleset does not let it through.
    environment: release
    permissions:
      contents: write # the GitHub release
      checks: read # the CI conclusions on the commit to release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Run from develop
        run: test "$GITHUB_REF" = refs/heads/develop || { echo "::error::run this workflow from develop, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Everything below checks, builds and pushes $GITHUB_SHA, the develop commit this run started on,
      # so a merge into develop during the run is not released by accident.
      - name: Version matches develop
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1; }
          plugin=$( (jq -er .version .claude-plugin/plugin.json plugin.json; echo "$VERSION") | sort -u)
          echo "plugin versions: $plugin"
          test "$(wc -l <<< "$plugin")" -eq 1 || { echo "::error::bump version in .claude-plugin/plugin.json and plugin.json to $VERSION on develop first"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged; bump the version"
            exit 1
          fi

      # push CI on develop runs these on every commit; a red or missing one stops the release.
      - name: CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: "validate|tests (3.11)|tests (3.13)"
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name)|\(.conclusion)"')
          echo "$runs"
          failed=0
          IFS='|' read -ra names <<< "$REQUIRED"
          for name in "${names[@]}"; do
            grep -qxF "$name|success" <<< "$runs" || { echo "::error::$name has not passed on $GITHUB_SHA"; failed=1; }
          done
          test "$failed" -eq 0

      - name: main is behind develop
        run: |
          git merge-base --is-ancestor origin/main "$GITHUB_SHA" || {
            echo "::error::main has commits develop lacks; merge main into develop first"
            git log --oneline "$GITHUB_SHA..origin/main"
            exit 1
          }

      # One ZIP for ChatGPT and Codex (plugin.json) and the claude.ai upload (.claude-plugin), built
      # before main moves so a broken one stops the release. It carries scripts/ because the story
      # skills run them; every ${CLAUDE_PLUGIN_ROOT} path a skill names must be in it.
      - name: Plugin ZIP
        run: |
          zip="zebra-bi-v$VERSION.zip"
          git archive --format=zip -o "$zip" "$GITHUB_SHA" -- .claude-plugin .mcp.json plugin.json mcp.json assets scripts ':(exclude)scripts/tests' skills README.md LICENSE NOTICE
          listed=$(unzip -Z1 "$zip")
          missing=0
          for path in $(grep -rhoE '\$\{CLAUDE_PLUGIN_ROOT\}/[A-Za-z0-9_./-]+' skills | sed 's|^${CLAUDE_PLUGIN_ROOT}/||' | sort -u); do
            grep -qxF "$path" <<< "$listed" || { echo "missing from the ZIP: $path"; missing=1; }
          done
          test "$missing" -eq 0

      # Atomic, so main and the tag move together or not at all. Without --force, a main that moved
      # since the check above is rejected rather than overwritten. The deploy key exists only in this
      # step; github.com's host keys come from the API over HTTPS.
      - name: Fast-forward main and tag
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/release_key" hosts="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key")
          curl -sf https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com \(.)"' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/heads/main" "$GITHUB_SHA:refs/tags/v$VERSION"
          echo "main and v$VERSION are at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "zebra-bi-v$VERSION.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  registry:
    needs: release
    runs-on: ubuntu-latest
    # The environment only accepts develop. It holds no secret: its variables name the Entra app that may
    # sign with the Registry key in Azure Key Vault, and GitHub's OIDC token proves the run is this one.
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write # the OIDC token azure/login exchanges; it can only reach what the Entra app may
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The plugin and the server carry separate versions: the tag names the plugin release,
      # server.json names the server's MCP Registry entry. The registry takes each server version once,
      # so publish only when server.json changed since the previous release tag (or on the first tag).
      - name: Is the server version new
        id: registry
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$(git show "$prev:server.json" | jq -er .version)" = "$(jq -er .version server.json)" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # Federated credential on the Entra app: repo:zebrabi@128390584/zebra-bi@1418768860:environment:mcp-registry-publish.
      # The repository issues GitHub's immutable OIDC subject (owner and repository IDs), so the plain form would not match.
      - name: Sign in to Azure (OIDC, no secret)
        if: steps.registry.outputs.publish == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The private key never leaves the vault: mcp-publisher reads the public key and asks the vault to
      # sign (ES384), which needs Get and Sign on that key (Key Vault Crypto User). The zebrabi.com TXT
      # record carries the matching public key (k=ecdsap384).
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_KEY_VAULT: ${{ vars.MCP_KEY_VAULT }}
          MCP_KEY_NAME: ${{ vars.MCP_KEY_NAME }}
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login dns azure-key-vault -domain zebrabi.com -vault "$MCP_KEY_VAULT" -key "$MCP_KEY_NAME"
          ./mcp-publisher publish
