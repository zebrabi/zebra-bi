name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    # MCP_PRIVATE_KEY is a secret on this environment, which only accepts v* tags.
    environment: mcp-registry-publish
    permissions:
      contents: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, manifests and server carry one version
        run: |
          tag=${GITHUB_REF_NAME#v}
          url=$(jq -er '.remotes[0].url' server.json)
          served=$(curl -sf -X POST "$url" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}' \
            | jq -er .result.serverInfo.version)
          versions=$( (jq -er .version .claude-plugin/plugin.json plugin.json server.json; echo "$tag"; echo "$served") | sort -u)
          echo "versions: $versions"
          test "$(wc -l <<< "$versions")" -eq 1

      - name: Install mcp-publisher
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login dns --domain zebrabi.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish

      # One ZIP for ChatGPT and Codex (plugin.json) and the claude.ai upload (.claude-plugin).
      - name: Plugin ZIP
        run: git archive --format=zip -o "zebra-bi-$GITHUB_REF_NAME.zip" HEAD -- .claude-plugin .mcp.json plugin.json mcp.json assets skills README.md LICENSE

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "zebra-bi-$GITHUB_REF_NAME.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
