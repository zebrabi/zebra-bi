name: MCP Registry

# Publishes server.json to the MCP Registry. The MCP server's version is independent of the plugin's, so
# this runs on its own: when server.json changes on main (main moves only on a release), or by hand from
# main once production serves a new version. It publishes only the version production serves, and each
# version once.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment only accepts main. It holds no secret: its variables name the Entra app that may
    # sign with the Registry key in Azure Key Vault, and GitHub's OIDC token proves the run is this one.
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write # the OIDC token azure/login exchanges; it can only reach what the Entra app may
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Run from main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::run this workflow from main, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry should list the version production runs. /mcp needs sign-in, so the server reports
      # its version on a public /version next to it (zebrabi/zai#539). No -L: a redirect fails the check
      # instead of being followed to another host.
      - name: server.json matches the live MCP
        run: |
          expected=$(jq -er .version server.json)
          live=$(curl --silent --show-error --fail --retry 3 --max-time 30 "$(jq -er '.remotes[0].url' server.json)/version" | jq -er .version)
          echo "server.json: $expected, live: $live"
          test "$live" = "$expected" || {
            echo "::error::server.json is at $expected but production serves $live; deploy the MCP first, then run this workflow from main"
            exit 1
          }

      # The registry takes each server version once and never changes it, so ask it whether this one is
      # listed. That also makes a re-run safe after a partial publish.
      - name: Is the server version new
        id: registry
        run: |
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -er '.name | @uri' server.json)/versions/$(jq -er '.version | @uri' server.json)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' "$url")
          case "$status" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "server $(jq -r .version server.json) is already listed" ;;
            *) echo "::error::registry lookup failed: HTTP $status"; exit 1 ;;
          esac

      - name: Install mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # Federated credential on the Entra app: repo:zebrabi@128390584/zebra-bi@1418768860:environment:mcp-registry-publish.
      # The repository issues GitHub's immutable OIDC subject (owner and repository IDs), so the plain form would not match.
      - name: Sign in to Azure (OIDC, no secret)
        if: steps.registry.outputs.publish == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The private key never leaves the vault: mcp-publisher reads the public key and asks the vault to
      # sign (ES384), which needs Get and Sign on that key (Key Vault Crypto User). The zebrabi.com TXT
      # record carries the matching public key (k=ecdsap384).
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_KEY_VAULT: ${{ vars.MCP_KEY_VAULT }}
          MCP_KEY_NAME: ${{ vars.MCP_KEY_NAME }}
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login dns azure-key-vault -domain zebrabi.com -vault "$MCP_KEY_VAULT" -key "$MCP_KEY_NAME"
          ./mcp-publisher publish

      # Whether published now or earlier, the listing must be this server.json, and active. A server.json
      # changed without a new version fails here, because the registry keeps the first listing.
      - name: Verify the listing
        env:
          LISTING_URL: ${{ steps.registry.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            -o "$RUNNER_TEMP/listing.json" "$LISTING_URL"
          jq -e --slurpfile expected server.json \
            '(.server | del(.["$schema"])) == ($expected[0] | del(.["$schema"])) and
             ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
            "$RUNNER_TEMP/listing.json" > /dev/null || {
            echo "::error::the registry's listing of $(jq -r .version server.json) differs from server.json or is not active; a changed server.json needs a new version"
            jq . "$RUNNER_TEMP/listing.json"
            exit 1
          }
          echo "MCP Registry lists server $(jq -r .version server.json): $LISTING_URL" >> "$GITHUB_STEP_SUMMARY"
