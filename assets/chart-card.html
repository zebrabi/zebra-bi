<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebra BI chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&amp;display=swap">
<!--
  One Zebra BI chart in the chat, an MCP App served by report_server.py for show_chart. The host sends it the tool's
  result, which names the chart by id and carries no data; the page asks the server for the chart (chart_card, app
  only) and the renderer (get_renderer), then nests the renderer through srcdoc as the builder does and hands it the
  chart's render_visual result. Before sign-in to Zebra BI it shows a grey placeholder in the chart's shape with the
  sign-in button, and draws the chart once the user has signed in.
-->
<style>
  :root { --ink:#000000; --muted:#5f6264; --hairline:#d9dadb; --paper:#ffffff; --soft:#f4f4f4; --accent:#FFD800;
    --accent-dark:#FBBA00; --focus:#000000; --font:'Open Sans', system-ui, -apple-system, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 300 14px/1.5 var(--font); }
  main { padding: 12px 14px 14px; }
  button { font: inherit; font-size: 13px; line-height: 18px; padding: 5px 11px; border: 1px solid var(--hairline); border-radius: 6px;
    background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--soft); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.link { border: 0; background: none; padding: 5px 2px; text-decoration: underline; text-underline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  iframe { display: block; width: 100%; height: 320px; border: 0; }
  iframe.arrived { animation: arrive .5s ease-out; }
  @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { iframe.arrived { animation: none; } }
  .loading, .err { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .err { color: #A4262C; }
  /* The placeholder: the chart's own title and subtitle, then light grey dashed outlines in its shape, labelled. No
     fill, no axis, no numbers: it must never pass for a drawn chart. */
  .ghost { border: 1px dashed var(--hairline); border-radius: 8px; padding: 10px 12px 12px; }
  .ghost .gt { font-size: 13px; font-weight: 700; color: var(--muted); }
  .ghost .gs { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .ghost svg { display: block; width: 100%; }
  .ghost .gl { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  .signin { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; padding: 10px 14px;
    border: 1px solid var(--hairline); border-radius: 8px; background: var(--soft); }
  .signin:empty { display: none; }
  .signin.ask { background: #fffbe0; border-color: #f3dd6a; }
  .signin .msg { flex: 1 1 220px; min-width: 0; }
  .signin .acts { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
</style></head>
<body>
<main>
  <div id="chart"><div class="loading">Loading the chart…</div></div>
  <div class="signin" id="signin" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- this page as an MCP App ----------
  var nextId = 1, pending = {};
  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++; pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params || {} }, '*');
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method: method, params: params || {} }, '*'); }
  // The server puts its key here when the host reads this page, and refuses its app-only tools without it.
  var APP_KEY = '__ZEBRA_BI_APP_KEY__';
  var APP_ONLY = ['chart_card', 'get_renderer', 'start_sign_in'];
  function callTool(name, args) {
    var a = {}, k;
    for (k in args || {}) a[k] = args[k];
    if (APP_ONLY.indexOf(name) >= 0) a.app_key = APP_KEY;
    return request('tools/call', { name: name, arguments: a }).then(function (r) {
      if (r && r.isError) {
        var err = new Error((r.content || []).map(function (c) { return c.text || ''; }).join(' ') || name + ' failed');
        err.result = r; throw err;
      }
      return r || {};
    });
  }
  function sc(r) { return (r && r.structuredContent) || {}; }
  var sizeTimer = null;
  function reportSize() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(function () {
      notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
    }, 60);
  }

  // ---------- state ----------
  var POLL_MS = 4000, POLL_FOR_MS = 20 * 60 * 1000, WAIT_AGAIN_MS = 5 * 60 * 1000;
  var SALES = 'https://zebrabi.com/contact-sales/', SUPPORT = 'support@zebrabi.com';
  var cid = null, card = null, auth = null, rendererText = null, rendererFetch = null, frame = null;
  var pollTimer = null, pollUntil = 0, waitingSince = null, started = false;

  function signedIn() { return !!(auth && auth.signed_in && !auth.refusal && auth.state !== 'waiting'); }

  function load() {
    if (!cid) return Promise.resolve();
    return callTool('chart_card', { chart: cid }).then(function (r) { take(sc(r)); }, function (e) {
      $('chart').innerHTML = ''; $('chart').appendChild(el('div', 'err', e.message)); reportSize();
    });
  }
  function take(d) {
    card = d; auth = d.auth || auth;
    if (auth && auth.state === 'waiting') { if (!waitingSince) waitingSince = Date.now(); } else waitingSince = null;
    if (d.error) { $('chart').innerHTML = ''; $('chart').appendChild(el('div', 'err', d.error)); renderBanner(); stopPoll(); reportSize(); return; }
    if (d.drawn && d.result) {
      stopPoll();
      if (rendererText) mount(); else fetchRenderer();
    } else {
      showGhost(); keepPolling();
    }
    renderBanner();
  }
  function fetchRenderer() {
    if (rendererFetch) return rendererFetch;
    rendererFetch = callTool('get_renderer').then(function (r) {
      rendererFetch = null; rendererText = sc(r).renderer; mount(); renderBanner();
    }, function (e) {
      rendererFetch = null;
      var s = e.result && e.result.structuredContent;
      if (s && s.auth) auth = s.auth;
      if (s && s.needs_sign_in) { showGhost(); keepPolling(); renderBanner(); return; }  // drawn before, on another sign-in
      $('chart').innerHTML = ''; $('chart').appendChild(el('div', 'err', e.message)); reportSize();
    });
    return rendererFetch;
  }
  function keepPolling() {
    if (!pollUntil) pollUntil = Date.now() + POLL_FOR_MS;
    clearTimeout(pollTimer);
    if (Date.now() > pollUntil) return;
    pollTimer = setTimeout(function () { if (document.hidden) keepPolling(); else load(); }, POLL_MS);
  }
  function stopPoll() { clearTimeout(pollTimer); pollTimer = null; pollUntil = 0; }

  // ---------- the chart: the Zebra BI renderer nested through srcdoc ----------
  function mount() {
    if (!card || !card.result || !rendererText) return;
    var box = $('chart'), ghost = box.querySelector('.ghost');
    if (frame && box.contains(frame)) return;
    box.innerHTML = '';
    frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('scrolling', 'no');
    frame.setAttribute('title', card.title || 'Zebra BI chart');
    frame._sent = false;
    if (ghost) { frame.className = 'arrived'; frame.style.height = '0'; box.appendChild(ghost); }
    box.insertBefore(frame, box.firstChild);
    frame.srcdoc = rendererText;
    reportSize();
  }
  function sendData() {
    if (!frame || frame._sent) return; frame._sent = true;
    frame.contentWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/tool-input', params: {} }, '*');
    frame.contentWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: card.result }, '*');
  }
  function answerFrame(m) {
    if (m.id != null && m.method) {
      if (m.method === 'ui/initialize') {
        var w = frame.clientWidth || $('chart').clientWidth;
        frame.contentWindow.postMessage({ jsonrpc: '2.0', id: m.id, result: {
          protocolVersion: (m.params && m.params.protocolVersion) || '2026-01-26',
          hostInfo: { name: 'zebra-bi-report', version: '1' }, hostCapabilities: {},
          hostContext: { toolInfo: { id: 1, tool: { name: 'render_visual', inputSchema: { type: 'object' } } },
            theme: 'light', displayMode: 'inline', maxWidth: w, viewport: { width: w } } } }, '*');
        setTimeout(sendData, 50);
      } else {
        frame.contentWindow.postMessage({ jsonrpc: '2.0', id: m.id, result: {} }, '*');
      }
    } else if (m.method === 'ui/notifications/initialized') {
      sendData();
    } else if (m.method === 'ui/notifications/size-changed' && m.params && m.params.height) {
      frame.style.height = Math.ceil(m.params.height) + 8 + 'px';  // a little slack: the reported height can trail the drawn one
      var g = $('chart').querySelector('.ghost'); if (g) g.remove();
      reportSize();
    }
  }

  // ---------- the placeholder ----------
  // Heights come from this fixed pattern, never from the chart's numbers, so a placeholder says nothing about the data.
  var GHOST_PATTERN = [0.62, 0.8, 0.5, 0.92, 0.7, 0.44, 0.84, 0.58, 0.74, 0.38, 0.88, 0.66];
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) { var e = document.createElementNS(SVG_NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function ghostLabel() { return signedIn() ? 'Zebra BI chart, drawing now…' : 'Zebra BI chart, drawn after sign-in'; }
  function showGhost() {
    var box = $('chart'), shape = (card && card.ghost) || { kind: 'bars', count: 5 };
    var n = Math.max(1, shape.count || 1), kind = shape.kind === 'columns' ? 'columns' : 'bars';
    var g = el('div', 'ghost');
    g.setAttribute('role', 'img');
    g.setAttribute('aria-label', ((card && card.title) || 'Chart') + ': ' + ghostLabel());
    if (card && card.title) g.appendChild(el('div', 'gt', card.title));
    if (card && card.subtitle) g.appendChild(el('div', 'gs', card.subtitle));
    var w = Math.max(200, (box.clientWidth || 340) - 26), stroke = '#b9bbbd', dash = '4 3', svg, i, p;
    if (kind === 'columns') {
      var h = 150, base = h - 6, step = (w - 8) / n, cw = Math.max(4, Math.min(36, step * 0.6));
      svg = svgEl('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, 'aria-hidden': 'true' });
      for (i = 0; i < n; i++) {
        p = GHOST_PATTERN[i % GHOST_PATTERN.length];
        var ch = Math.round((base - 10) * p);
        svg.appendChild(svgEl('rect', { x: (4 + i * step + (step - cw) / 2).toFixed(1), y: base - ch, width: cw.toFixed(1), height: ch,
          rx: 2, fill: 'none', stroke: stroke, 'stroke-width': 1.25, 'stroke-dasharray': dash }));
      }
      svg.appendChild(svgEl('line', { x1: 0, x2: w, y1: base + 0.5, y2: base + 0.5, stroke: stroke, 'stroke-width': 1.25, 'stroke-dasharray': dash }));
    } else {
      var rowH = 22, bh = 12, top = 4, ht = top * 2 + n * rowH, lab = Math.round(w * 0.24), axis = lab + 10, room = w - axis - 6;
      svg = svgEl('svg', { width: w, height: ht, viewBox: '0 0 ' + w + ' ' + ht, 'aria-hidden': 'true' });
      for (i = 0; i < n; i++) {
        p = GHOST_PATTERN[(i * 5 + 3) % GHOST_PATTERN.length];
        var y = top + i * rowH + (rowH - bh) / 2;
        svg.appendChild(svgEl('line', { x1: 0, x2: Math.round(lab * (0.55 + 0.4 * GHOST_PATTERN[(i + 2) % GHOST_PATTERN.length])), y1: y + bh / 2, y2: y + bh / 2,
          stroke: '#d9dadb', 'stroke-width': 1.25, 'stroke-dasharray': '2 3' }));
        svg.appendChild(svgEl('rect', { x: axis, y: y, width: Math.max(8, Math.round(room * p)), height: bh, rx: 2,
          fill: 'none', stroke: stroke, 'stroke-width': 1.25, 'stroke-dasharray': dash }));
      }
      svg.appendChild(svgEl('line', { x1: axis - 0.5, x2: axis - 0.5, y1: 0, y2: ht, stroke: stroke, 'stroke-width': 1.25, 'stroke-dasharray': dash }));
    }
    g.appendChild(svg);
    g.appendChild(el('div', 'gl', ghostLabel()));
    box.innerHTML = ''; frame = null;
    box.appendChild(g);
    reportSize();
  }

  // ---------- sign-in to Zebra BI ----------
  function openLink(url) {
    return request('ui/open-link', { url: url }).then(function (r) {
      if (r && r.isError) throw new Error('refused');
    }).catch(function () {
      var w = null;
      try { w = window.open(url, '_blank', 'noopener'); } catch (e) { w = null; }
      if (!w) {
        var box = $('signin'); box.appendChild(el('div', 'msg', 'Open this page in your browser: ' + url));
        reportSize();
      }
    });
  }
  function startSignIn(btn) {
    if (btn) btn.disabled = true;
    return callTool('start_sign_in').then(function (r) {
      var d = sc(r);
      if (d.url && !d.opened) openLink(d.url);
      if (d.auth) auth = d.auth;
      if (auth && auth.state === 'waiting' && !waitingSince) waitingSince = Date.now();
      renderBanner(); pollUntil = 0; keepPolling();
    }, function (e) {
      if (btn) btn.disabled = false;
      var s = e.result && e.result.structuredContent;
      if (s && s.auth) auth = s.auth;
      renderBanner();
      $('signin').appendChild(el('div', 'msg', e.message)); reportSize();
    });
  }
  function bannerButton(label, cls, run) {
    var b = el('button', cls, label); b.type = 'button';
    b.onclick = function () { run(b); };
    return b;
  }
  function renderBanner() {
    var box = $('signin');
    box.innerHTML = ''; box.className = 'signin';
    var g = $('chart').querySelector('.ghost .gl'); if (g) g.textContent = ghostLabel();
    if (!card || !auth || (card.drawn && card.result && rendererText) || card.error) { reportSize(); return; }
    var a = auth, msg = el('div', 'msg'), acts = el('div', 'acts');
    var signIn = function (label) { return bannerButton(label, 'primary', startSignIn); };
    if (a.state === 'waiting') {
      msg.textContent = 'Finish signing in in your browser. The chart appears here as soon as you are back.';
      if (a.url) acts.appendChild(bannerButton('Open the sign-in page again', 'link', function () { openLink(a.url); }));
      if (waitingSince && Date.now() - waitingSince >= WAIT_AGAIN_MS) acts.appendChild(signIn('Sign in to Zebra BI'));
    } else if (a.refusal) {
      var r = a.refusal, k = r.kind;
      if (k === 'trial_ended') {
        msg.textContent = r.date ? 'Your Zebra BI trial ended on ' + r.date + '. The chart needs a Zebra BI licence.'
                                 : 'Your Zebra BI trial ended. The chart needs a Zebra BI licence.';
        acts.appendChild(bannerButton('Contact sales', 'primary', function () { openLink(SALES); }));
      } else if (k === 'no_licence') {
        msg.textContent = 'Zebra BI found no licence for your company.';
        acts.appendChild(signIn('Sign in again'));
      } else if (k === 'no_verified_email') {
        msg.textContent = r.message || 'Microsoft shared no verified email address for your account.';
        acts.appendChild(bannerButton(SUPPORT, 'link', function () { openLink('mailto:' + SUPPORT); }));
      } else if (k === 'expired') {
        msg.textContent = 'Your Zebra BI sign-in has expired. Sign in again to draw the chart.';
        acts.appendChild(signIn('Sign in again'));
      } else {
        msg.textContent = r.message || 'Zebra BI did not draw the chart.';
        acts.appendChild(bannerButton('Contact sales', 'primary', function () { openLink(SALES); }));
      }
    } else if (!a.signed_in) {
      box.classList.add('ask');
      msg.textContent = 'Sign in to Zebra BI to draw this chart.';
      acts.appendChild(signIn('Sign in to Zebra BI'));
    } else {
      reportSize(); return;  // signed in: the chart is drawing
    }
    box.appendChild(msg); box.appendChild(acts);
    reportSize();
  }

  // ---------- messages ----------
  function chartFrom(params) { var c = sc(params).chart; return typeof c === 'string' ? c : null; }
  window.addEventListener('message', function (ev) {
    var m = ev.data; if (!m || m.jsonrpc !== '2.0') return;
    if (frame && ev.source === frame.contentWindow) { answerFrame(m); return; }
    if (ev.source !== window.parent) return;
    if (m.id != null && !m.method && pending[m.id]) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) p.reject(new Error(m.error.message || 'request failed')); else p.resolve(m.result);
    } else if (m.id != null && m.method) {
      window.parent.postMessage({ jsonrpc: '2.0', id: m.id, result: {} }, '*');
    } else if (m.method === 'ui/notifications/tool-result') {
      var c = chartFrom(m.params);
      if (c && c !== cid) { cid = c; card = null; if (started) load(); }
    }
  });
  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    if (Math.abs(window.innerWidth - lastWidth) > 40 && card && !(card.drawn && rendererText)) { lastWidth = window.innerWidth; showGhost(); renderBanner(); }
  });

  // ---------- start ----------
  request('ui/initialize', {
    appInfo: { name: 'zebra-bi-chart', version: '1' },
    appCapabilities: { availableDisplayModes: ['inline'] },
    protocolVersion: '2026-01-26'
  }).then(function (init) {
    notify('ui/notifications/initialized');
    started = true;
    var ctx = (init && init.hostContext) || {}, out = ctx.toolOutput || (ctx.toolResult && sc(ctx.toolResult));
    if (!cid && out && typeof out.chart === 'string') cid = out.chart;
    return load();
  }, function () { $('chart').innerHTML = ''; $('chart').appendChild(el('div', 'err', 'Not connected')); });
})();
</script>
</body></html>
