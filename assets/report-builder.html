<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebra BI reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700&amp;display=swap">
<!--
  The Zebra BI report builder, an MCP App served by report_server.py. Two views: the home ("All reports": open,
  create, rename, duplicate, delete, Recently deleted) and the editor (rows of up to three chart or text cells).
  It is two things at once:
  - an MCP App to its host (ChatGPT, Codex, Claude): ui/initialize, tools/call of the server's tools, size-changed;
  - a host to the Zebra BI renderer: every chart cell nests the renderer page in an iframe through srcdoc with
    sandbox allow-scripts and answers its ui/initialize with the cell's width, then sends it the chart's
    render_visual result. srcdoc, not a blob: URL, because the desktop hosts' CSP blocks blob: frames; the frame's
    opaque origin also keeps the renderer off the location.origin path that throws in blob: frames.
  Every edit is a tool call and every report is the server's file; the page keeps no state beyond what it shows.
  Opened inline in a chat it follows that chat's report; opened from the sidebar it follows the report opened last.
-->
<style>
  /* Zebra BI brand: black and Power BI yellow on white, Open Sans Light and Bold (the system font where it cannot
     load). Yellow is a fill with black text on it; focus rings and drag markers stay black, which reads on white.
     The charts keep their IBCS colours. */
  :root { --ink:#000000; --muted:#5f6264; --hairline:#d9dadb; --paper:#ffffff; --soft:#f4f4f4; --accent:#FFD800;
    --accent-dark:#FBBA00; --focus:#000000; --danger:#A4262C; --font:'Open Sans', system-ui, -apple-system, sans-serif;
    color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 300 14px/1.5 var(--font); caret-color: var(--ink); }
  ::selection { background: var(--accent); color: var(--ink); }
  b, strong { font-weight: 700; }
  /* The bar stays on one line at every width. When it does not fit, fitBar() folds it a step at a time:
     fit-1 drops the brand, Reload and the Full screen label; fit-2 leaves the back link its arrow; fit-3 turns
     the layouts into a menu; fit-4 moves Notes and + Text into the More menu. */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px;
    min-height: 52px; padding: 9px 20px; overflow: hidden; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--hairline); }
  .bar > *, #editor-actions > * { flex: none; }
  .bar .brand { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bar .spacer { flex: 1 1 auto; min-width: 4px; }
  #editor-actions { display: inline-flex; align-items: center; gap: 8px; }
  button { font: inherit; font-size: 13px; line-height: 18px; padding: 5px 11px; border: 1px solid var(--hairline); border-radius: 6px;
    background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--soft); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button svg { display: block; width: 16px; height: 16px; flex: none; }
  button.icon, .withicon { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button.icon { padding: 5px 6px; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--paper); }
  .seg button { border: 0; border-radius: 6px; padding: 4px 10px; }
  .seg button[aria-checked=true] { background: var(--accent); font-weight: 700; }
  .seg button[aria-checked=true]:hover { background: var(--accent-dark); }
  #layout-pick { display: none; }
  #layout-pick span { font-weight: 700; }
  .bar.fit-1 .brand, .bar.fit-1 #reload, .bar.fit-1 #full .lbl { display: none; }
  .bar.fit-1 #full { padding: 5px 6px; }
  .bar.fit-2 #back .lbl { display: none; }
  .bar.fit-3 #layouts { display: none; }
  .bar.fit-3 #layout-pick { display: inline-flex; }
  .bar.fit-4 #notes-toggle, .bar.fit-4 #add-text { display: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.danger { color: var(--danger); }
  button.link { border: 0; padding: 5px 6px; background: none; color: var(--muted); }
  button.link:hover { color: var(--ink); background: none; }
  input[type=text] { font: inherit; padding: 6px 10px; border: 1px solid var(--hairline); border-radius: 6px; min-width: 0; }
  input[type=text]:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .status { flex: none; width: 76px; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 20px 80px; }
  h1 { margin: 0 0 16px; font: 700 26px/1.2 var(--font); letter-spacing: -.01em; outline: none; border-radius: 4px; }
  h1[contenteditable]:focus { box-shadow: 0 0 0 2px var(--focus); }
  [hidden] { display: none !important; }

  /* home */
  .home-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .home-head h1 { margin: 0 auto 0 0; }
  .newform { display: flex; gap: 8px; margin: 0 0 16px; }
  .newform input { flex: 1 1 auto; max-width: 480px; }
  .search { width: min(260px, 100%); margin-bottom: 12px; }
  .list { border-top: 1px solid var(--hairline); }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--hairline); }
  .item:hover { background: var(--soft); }
  .item .main { flex: 1 1 auto; min-width: 0; cursor: pointer; border-radius: 4px; }
  .item .main:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { font-size: 12px; color: var(--muted); }
  .item .badge { font-size: 11px; color: var(--ink); background: var(--accent); border-radius: 3px; padding: 1px 6px;
    margin-left: 8px; font-weight: 700; }
  .item input { width: 100%; max-width: 480px; }
  details.deleted { margin-top: 28px; }
  details.deleted summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--danger); }
  .empty { margin: 24px 0; padding: 40px; border: 1px dashed var(--hairline); border-radius: 8px; color: var(--muted); text-align: center; }

  /* menu */
  .menu { position: fixed; z-index: 20; min-width: 160px; padding: 4px; background: var(--paper); border: 1px solid var(--hairline);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 4px; padding: 7px 10px; }
  .menu button:focus-visible { outline: none; background: var(--soft); box-shadow: inset 0 0 0 2px var(--focus); }
  .menu .tick { width: 16px; height: 16px; flex: none; }
  .menu hr { border: 0; border-top: 1px solid var(--hairline); margin: 4px 2px; }

  /* editor */
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .slot { height: 14px; margin: 2px 0; border-radius: 4px; }
  .slot.over { height: 36px; background: rgba(255,216,0,.18); outline: 2px dashed var(--focus); }
  /* Cells sit side by side as the PDF prints them, but never narrower than a chart can be read at (about 340 px):
     in a narrow window a row wraps instead. */
  .cell { position: relative; flex: 1 1 340px; min-width: 0; border: 1px solid transparent; border-radius: 8px; padding: 6px; }
  .cell:hover { border-color: var(--hairline); }
  .cell.over-before { box-shadow: -3px 0 0 var(--focus); }
  .cell.over-after { box-shadow: 3px 0 0 var(--focus); }
  .cell.dragging { opacity: .4; }
  .tools { position: absolute; top: 4px; right: 4px; display: none; gap: 4px; z-index: 2; }
  .cell:hover .tools { display: flex; }
  .tools span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; background: var(--paper);
    border: 1px solid var(--hairline); color: var(--muted); cursor: pointer; user-select: none; }
  .tools span:hover { color: var(--ink); }
  .tools svg, .why-btn svg { width: 14px; height: 14px; display: block; }
  @media (hover: none) { .tools { display: flex; } }
  .tools .grip { cursor: grab; }
  .chart iframe { display: block; width: 100%; height: 0; border: 0; background: #fff; }
  .chart .wait, .chart .err { padding: 24px 8px; color: var(--muted); font-size: 13px; }
  .chart .err { color: var(--danger); }
  .text { min-height: 2.6em; padding: 4px 6px; outline: none; border-radius: 4px; white-space: pre-wrap; max-width: 75ch; }
  .text:focus { box-shadow: 0 0 0 2px var(--focus); }
  .text:empty::before { content: 'Write here…'; color: var(--muted); }
  .chart-note { min-height: 1.6em; margin-top: 8px; font-size: 13px; }
  .chart-note:empty::before { content: 'Add the evidence: the numbers from this chart that prove its message…'; }
  .key, .chart-msg, .kpi .v, .kpi .l { outline: none; border-radius: 4px; white-space: pre-wrap; }
  .key:focus, .chart-msg:focus, .kpi .v:focus, .kpi .l:focus { box-shadow: 0 0 0 2px var(--focus); }
  .key { min-height: 1.5em; margin: -6px 0 14px; font-size: 17px; font-weight: 700; line-height: 1.4; max-width: 75ch; }
  .key:empty::before { content: 'Add the key message: what happened, how big, against what…'; color: var(--muted); font-weight: 400; }
  /* KPI tiles: all in one row, two by two once four no longer fit, never three and a lone fourth. */
  .kpis { display: grid; grid-template-columns: repeat(var(--tiles), minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
  .kpis.n1 { --tiles: 1; } .kpis.n2 { --tiles: 2; } .kpis.n3 { --tiles: 3; } .kpis.n4 { --tiles: 4; }
  @media (max-width: 720px) { .kpis.n4 { --tiles: 2; } }
  @media (max-width: 460px) { .kpis.n3 { --tiles: 1; } }
  .kpi { border-top: 2px solid var(--ink); padding-top: 6px; }
  .kpi .v { font-size: 20px; font-weight: 700; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .chart-head { display: flex; align-items: flex-start; gap: 4px; margin: 0 56px 6px 0; }
  .chart-msg { flex: 1 1 auto; min-height: 1.4em; font-weight: 700; padding: 2px 4px; }
  .chart-msg:empty::before { content: 'Add the message for this chart…'; color: var(--muted); font-weight: 400; }
  .why-btn { border: 0; background: none; padding: 3px; color: var(--muted); }
  .why-btn:hover { background: none; color: var(--ink); }
  .why-text { font-size: 12px; color: var(--muted); margin: 0 0 6px 4px; }
  .flag { display: flex; align-items: center; gap: 8px; margin: 4px 0; padding: 4px 8px; border-radius: 6px; background: #fdecec;
    color: var(--danger); font-size: 12px; }
  .flag button { font-size: 12px; padding: 2px 8px; }
  #layouts { display: inline-flex; gap: 4px; margin-right: 8px; }
  #layouts button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .layout-hint { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .layout-hint:empty { display: none; }
  .page-mark { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); }
  .page-mark::after { content: ''; flex: 1; border-top: 1px dashed var(--hairline); }
  .note { margin-top: 24px; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    .bar { padding: 8px 12px; }
    main { padding: 16px 14px 64px; }
    h1 { font-size: 22px; }
    .key { font-size: 16px; }
  }

  /* toast, at the top: ChatGPT lays its own composer over the bottom of the app */
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--ink); color: #fff; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    max-width: calc(100vw - 32px); overflow-wrap: anywhere; }
  .toast button { background: none; border-color: rgba(255,255,255,.4); color: #fff; padding: 3px 9px; }
</style></head>
<body>
<div class="bar" id="bar">
  <button class="link withicon" id="back" hidden title="All reports" aria-label="All reports"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3.5M7.5 4 3.5 8l4 4"/></svg><span class="lbl">All reports</span></button>
  <span class="brand" id="brand">Zebra BI reports</span>
  <span class="spacer"></span>
  <span class="status" id="status" role="status"></span>
  <span id="editor-actions" hidden>
    <span id="layouts" class="seg" role="radiogroup" aria-label="Layout">
      <button role="radio" aria-checked="false" data-layout="one-pager" title="Largest variances first, up to three charts a row, notes hidden; the PDF fits one landscape page">One-pager</button><button role="radio" aria-checked="false" data-layout="variance-walk" title="One chart a row in the order they were built, each with its note">Variance walk</button><button role="radio" aria-checked="false" data-layout="board-pack" title="One chart a row, largest variances first; the PDF has a cover and a page per chart">Board pack</button>
    </span>
    <button class="withicon" id="layout-pick" aria-haspopup="menu" title="Layout">Layout: <span id="layout-pick-label">none</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg></button>
    <button id="add-text" title="Add a text row">+ Text</button>
    <button id="notes-toggle" aria-pressed="true" title="Show or hide the notes under the charts, here and in the PDF and page">Notes: on</button>
    <button id="reload" title="Reload from the report file">Reload</button>
    <button class="dots icon" id="report-menu" aria-haspopup="menu" title="More" aria-label="More"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.25" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.75" cy="8" r="1.4"/></svg></button>
  </span>
  <button class="withicon" id="full" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9.25 6.75M2.5 13.5l4.25-4.25"/></svg><span class="lbl">Full screen</span></button>
</div>

<main id="home" hidden>
  <div class="home-head">
    <h1>Reports</h1>
    <button class="primary" id="new">New report</button>
  </div>
  <div class="newform" id="newform" hidden>
    <input type="text" id="newtitle" placeholder="Title, for example P&amp;L close November 2026" maxlength="200">
    <button class="primary" id="newcreate">Create</button>
    <button id="newcancel">Cancel</button>
  </div>
  <input type="text" class="search" id="search" placeholder="Search reports" hidden>
  <div id="list"></div>
  <details class="deleted" id="deleted" hidden><summary id="deleted-sum"></summary><div class="list" id="deleted-list"></div></details>
</main>

<main id="editor" hidden>
  <h1 id="title" contenteditable="true" spellcheck="false"></h1>
  <div id="head"></div>
  <p class="layout-hint" id="layout-hint"></p>
  <div id="rows"></div>
  <p class="note" id="note"></p>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function status(s) { $('status').textContent = s; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- this page as an MCP App ----------
  var nextId = 1, pending = {};
  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++; pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params || {} }, '*');
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method: method, params: params || {} }, '*'); }
  function callTool(name, args) {
    return request('tools/call', { name: name, arguments: args || {} }).then(function (r) {
      if (r && r.isError) {
        var err = new Error((r.content || []).map(function (c) { return c.text || ''; }).join(' ') || name + ' failed');
        err.result = r; throw err;
      }
      return r || {};
    });
  }
  function sc(r) { return (r && r.structuredContent) || {}; }
  var sizeTimer = null;
  function reportSize() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(function () {
      notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
    }, 60);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(message, action, onAction, ms) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = el('div', 'toast'); t.appendChild(el('span', null, message));
    if (action) { var b = el('button', null, action); b.onclick = function () { t.remove(); onAction(); }; t.appendChild(b); }
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, ms || (action ? 8000 : 4000));
  }
  function fail(e) { toast(e && e.message ? e.message : 'Something went wrong'); }

  // ---------- icons: drawn, one stroke weight ----------
  var ICONS = {
    more: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.25" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.75" cy="8" r="1.4"/></svg>',
    check: '<svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>',
    grip: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg>',
    close: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.25v4"/><circle cx="8" cy="4.9" r=".4" fill="currentColor"/></svg>'
  };
  function iconEl(tag, cls, name, label) {
    var e = el(tag, cls); e.innerHTML = ICONS[name]; e.title = label; e.setAttribute('aria-label', label); return e;
  }

  // ---------- menu ----------
  // A popup menu of buttons: Up and Down move through it, Escape closes it and gives focus back to its button.
  // An item with `checked` (true or false) is a choice; `sep` puts a rule above the item. Focus moves into the
  // menu when it was opened from the keyboard (a click with detail 0), so a mouse user sees no ring.
  var menuAnchor = null;
  function openMenu(anchor, items, align, ev) {
    closeMenu();
    var m = el('div', 'menu'); m.id = 'menu'; m.setAttribute('role', 'menu');
    items.forEach(function (it) {
      if (it.sep) m.appendChild(el('hr'));
      var b = el('button', it.danger ? 'danger' : null);
      b.setAttribute('role', it.checked == null ? 'menuitem' : 'menuitemradio');
      if (it.checked != null) { b.setAttribute('aria-checked', String(!!it.checked)); b.innerHTML = it.checked ? ICONS.check : '<span class="tick"></span>'; }
      b.appendChild(document.createTextNode(it.label));
      b.onclick = function (e) { e.stopPropagation(); closeMenu(); it.run(); };
      m.appendChild(b);
    });
    m.addEventListener('keydown', function (e) {
      var bs = Array.prototype.slice.call(m.querySelectorAll('button')), i = bs.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus();
      }
    });
    document.body.appendChild(m);
    var r = anchor.getBoundingClientRect(), left = align === 'left' ? r.left : r.right - m.offsetWidth;
    m.style.top = (r.bottom + 4) + 'px';
    m.style.left = Math.max(8, Math.min(left, window.innerWidth - m.offsetWidth - 8)) + 'px';
    menuAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
    if (ev && ev.detail === 0) (m.querySelector('[aria-checked=true]') || m.querySelector('button')).focus();
  }
  function closeMenu(refocus) {
    var m = $('menu'); if (m) m.remove();
    if (menuAnchor) { menuAnchor.setAttribute('aria-expanded', 'false'); if (refocus) menuAnchor.focus(); menuAnchor = null; }
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('.menu') && !e.target.closest('[aria-haspopup]')) closeMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('menu')) closeMenu(true); });

  // ---------- the bar: one line at every width ----------
  var FITS = ['fit-1', 'fit-2', 'fit-3', 'fit-4'];
  function fitBar() {
    var bar = $('bar');
    FITS.forEach(function (c) { bar.classList.remove(c); });
    for (var i = 0; i < FITS.length && bar.scrollWidth > bar.clientWidth; i++) bar.classList.add(FITS[i]);
  }

  // ---------- state ----------
  var view = null, follow = 'last', lib = null, slug = null, rep = null, results = {}, errors = {};
  var rendererText = null, rendererError = null;
  var saving = false, dirty = false, saveTimer = null, dragId = null, busy = false;

  function show(which) {
    view = which; closeMenu();
    $('home').hidden = which !== 'home';
    $('editor').hidden = which !== 'editor';
    $('back').hidden = which !== 'editor';
    $('editor-actions').hidden = which !== 'editor';
    $('brand').textContent = which === 'editor' ? 'Zebra BI report' : 'Zebra BI reports';
    status('');
    fitBar();
  }

  // ---------- actions (every one is a tool call) ----------
  function act(promise, after) {
    busy = true;
    return promise.then(function (r) { busy = false; return after ? after(r) : r; }, function (e) { busy = false; fail(e); });
  }

  function poll(force) {
    if (view !== 'editor' || dirty || saving || dragId || busy || !slug) return Promise.resolve();
    return callTool('get_report', { report: slug, follow: follow, since: force ? undefined : rep && rep.rev }).then(function (r) {
      var d = sc(r);
      if (d.switched) {
        return loadReport(d.switched).then(function () { toast('Opened in chat: ' + (rep ? rep.title : d.switched)); });
      }
      if (d.gone) { reportGone(); return; }
      if (d.unchanged) return;
      rep = d.report; results = d.results || {}; errors = d.errors || {}; checks = d.checks || {};
      renderEditor(); status('');
    }, function () { status('Not connected'); });
  }

  $('title').addEventListener('input', scheduleSave);
  $('title').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('title').blur(); } });
  $('back').onclick = function () { goHome(); };
  $('add-text').onclick = addText;
  function setLayout(layout) {
    flushSave().then(function () {
      return act(callTool('arrange_report', { report: slug, layout: layout }), function () { return loadReport(slug); });
    });
  }
  function toggleNotes() { rep.show_notes = rep.show_notes === false; renderEditor(); scheduleSave(); }
  document.querySelectorAll('#layouts button').forEach(function (b) {
    b.onclick = function () { if (b.getAttribute('aria-checked') !== 'true') setLayout(b.dataset.layout); };
  });
  $('layouts').addEventListener('keydown', function (e) {  // a radio group: the arrows move the choice
    var bs = Array.prototype.slice.call(document.querySelectorAll('#layouts button')), i = bs.indexOf(document.activeElement);
    if (i < 0 || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    e.preventDefault();
    var next = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length];
    next.focus(); next.click();
  });
  $('layout-pick').onclick = function (e) {
    e.stopPropagation();
    openMenu($('layout-pick'), Object.keys(LAYOUT_NAMES).map(function (id) {
      return { label: LAYOUT_NAMES[id], checked: rep.layout === id, run: function () { if (rep.layout !== id) setLayout(id); } };
    }), 'left', e);
  };
  $('reload').onclick = function () { poll(true); };
  $('notes-toggle').onclick = toggleNotes;
  $('report-menu').onclick = function (e) {
    e.stopPropagation();
    var bar = $('bar'), folded = [];  // what the bar folded away at this width comes first
    if (bar.classList.contains('fit-4')) {
      folded.push({ label: '+ Text', run: addText });
      folded.push({ label: rep.show_notes !== false ? 'Hide notes' : 'Show notes', run: toggleNotes });
    }
    if (bar.classList.contains('fit-1')) folded.push({ label: 'Reload', run: function () { poll(true); } });
    var items = [
      { label: 'Duplicate', run: function () { duplicateReport(slug, null, true); } },
      { label: 'Save as PDF', run: function () { savePdf(slug); } },
      { label: 'All reports', run: function () { goHome(); } },
      { label: 'Delete', danger: true, sep: true, run: function () { deleteReport(slug, rep.title); } }
    ];
    if (folded.length) items[0].sep = true;
    openMenu($('report-menu'), folded.concat(items), null, e);
  };
  $('full').onclick = function () { request('ui/request-display-mode', { mode: 'fullscreen' }).catch(function () {}); };

  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    closeMenu();
    fitBar();
    if (view === 'editor' && rep && Math.abs(window.innerWidth - lastWidth) > 40) { lastWidth = window.innerWidth; renderEditor(); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBar);  // Open Sans is wider than the fallback

  // ---------- start ----------
  var started = false, launchSlug = null;
  status('Connecting…');
  request('ui/initialize', {
    appInfo: { name: 'zebra-bi-report', version: '1' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    protocolVersion: '2026-01-26'
  }).then(function (init) {
    var ctx = (init && init.hostContext) || {};
    follow = ctx.displayMode === 'inline' ? 'thread' : 'last';  // in a chat: that chat's report; in the sidebar: the last one
    notify('ui/notifications/initialized');
    status('Loading…');
    return callTool('get_renderer').then(function (r) { rendererText = sc(r).renderer; }, function (e) { rendererError = e.message; });
  }).then(function () {
    return callTool('library');
  }).then(function (r) {
    lib = sc(r); started = true;
    var s = launchSlug || (follow === 'last' ? lib.last : lib.current);
    return s ? loadReport(s) : goHome();
  }).then(function () {
    setInterval(function () {
      if (document.hidden) return;
      if (view === 'editor') poll(false);
      else if (view === 'home' && !busy && !$('menu') && $('newform').hidden) refreshLibrary(true);
    }, 4000);
  }, function () { status('Not connected'); });
})();
</script>
</body></html>
